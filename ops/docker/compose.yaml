services:
  thermal-control:
    image: dgx-thermal-control:stable-control-20261015
    container_name: dgx-thermal-control
    pull_policy: never
    network_mode: host
    user: "1000:1000"
    read_only: true
    restart: unless-stopped
    stop_grace_period: 45s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 32
    cpus: 0.5
    ulimits:
      core: {soft: 0, hard: 0}
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - type: bind
        source: /home/bestvcboy/dgx-thermal/state
        target: /home/bestvcboy/dgx-thermal/state
        bind: {create_host_path: false}
      - type: bind
        source: /home/bestvcboy/dgx-thermal-control-admission
        target: /home/bestvcboy/dgx-thermal-control-admission
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /home/bestvcboy/dgx-thermal-control-evidence
        target: /home/bestvcboy/dgx-thermal-control-evidence
        bind: {create_host_path: false}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
